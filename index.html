
<script>
const SITE_BASE = "https://noel200305.github.io/noel/";

// MOBILE MENU
const menuBtn = document.getElementById("menuBtn");
const navLinks = document.getElementById("navLinks");

if (menuBtn && navLinks) {
    menuBtn.addEventListener("click", () => {
        const open = navLinks.classList.toggle("active");
        menuBtn.textContent = open ? "✕" : "☰";
        menuBtn.setAttribute("aria-expanded", open);
    });

    document.querySelectorAll(".nav-links a").forEach(link => {
        link.addEventListener("click", () => {
            navLinks.classList.remove("active");
            menuBtn.textContent = "☰";
            menuBtn.setAttribute("aria-expanded", "false");
        });
    });
}

// COPYRIGHT
document.getElementById("year").textContent =
    new Date().getFullYear();

// POWERPOINT FILES
const presentations = {
    presentation1: {
        title: "Intermediate HTML & CSS",
        file: "intermediate.pptx"
    },
    presentation2: {
        title: "Advanced HTML & CSS",
        file: "advanced-html-css.pptx"
    },
    presentation3: {
        title: "JavaScript",
        file: "javascript.pptx"
    }
};

// OPEN POWERPOINT
function openPresentation(id) {
    const item = presentations[id];
    if (!item) return;

    const fileURL = new URL(item.file, SITE_BASE).href;

    const viewerURL =
        "https://view.officeapps.live.com/op/embed.aspx?src=" +
        encodeURIComponent(fileURL);

    document.getElementById("viewerTitle").textContent =
        item.title;

    document.getElementById("pptFrame").src = viewerURL;

    const viewer =
        document.getElementById("presentationViewer");

    viewer.hidden = false;

    viewer.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}

// CLOSE POWERPOINT
function closePresentation() {
    document.getElementById("pptFrame").src = "";
    document.getElementById("presentationViewer").hidden = true;
}

// VIDEO PLAYER
const videoModal = document.getElementById("videoModal");
const mainVideo = document.getElementById("mainVideo");

function playVideo(file, title) {
    mainVideo.pause();

    mainVideo.src = new URL(file, SITE_BASE).href;

    document.getElementById("videoTitle").textContent = title;

    videoModal.hidden = false;
    document.body.style.overflow = "hidden";

    mainVideo.load();

    mainVideo.play().catch(() => {});
}

// CLOSE VIDEO
function closeVideo() {
    mainVideo.pause();
    mainVideo.removeAttribute("src");
    mainVideo.load();

    videoModal.hidden = true;
    document.body.style.overflow = "";
}

// KEYBOARD ESCAPE
document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        if (!videoModal.hidden) closeVideo();

        if (!document.getElementById("presentationViewer").hidden) {
            closePresentation();
        }
    }
});
</script>

</body>
</html>
